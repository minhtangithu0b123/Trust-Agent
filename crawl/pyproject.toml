[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-agent-labor-rag"
version = "0.1.0"
description = "MVP Labor Agent retrieval API for Vietnamese legal documents"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "langchain-core>=0.3,<1",
  "langchain-chroma>=0.2,<1",
  "langchain-huggingface>=0.1,<1",
  "sentence-transformers>=3.3,<4",
  "chromadb>=0.5,<1",
  "ftfy>=6.3,<7",
  "rank-bm25>=0.2.2,<1",
  "langchain-openai>=0.2,<1",
  "langgraph>=0.3,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
payments = ["x402[evm]==2.25.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
