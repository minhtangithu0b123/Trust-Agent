<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trust Agent — System Architecture</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; font-family: Inter, Segoe UI, Arial, sans-serif; }
    .frame { max-width: 1700px; margin: auto; background: white; border: 1px solid #cbd5e1; border-radius: 18px; padding: 22px; box-shadow: 0 12px 36px #0f172a14; }
    h1 { margin: 0 0 5px; font-size: 28px; } p { margin: 0 0 18px; color: #475569; }
    svg { width: 100%; height: auto; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; font-size: 13px; color: #475569; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; } .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    @media (prefers-color-scheme: dark) { body { background:#0f172a; color:#e2e8f0; } .frame { background:#111827; border-color:#334155; } p,.legend { color:#94a3b8; } }
  </style>
</head>
<body>
<main class="frame">
  <h1>Trust Agent — Vietnamese Legal Agentic RAG</h1>
  <p>Runtime question answering, legal evidence verification, and corpus administration</p>
  <svg viewBox="0 0 1600 1050" role="img" aria-label="Trust Agent system architecture diagram">
    <defs>
      <marker id="arrow-flow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 L 3.5 6 Z" fill="#475569"/></marker><marker id="arrow-audit" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 L 3.5 6 Z" fill="#94a3b8"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter>
    </defs>
    <style>
      .title { font: 700 18px Arial; fill:#0f172a; } .label { font: 600 15px Arial; fill:#0f172a; } .small { font: 13px Arial; fill:#334155; } .group { font: 700 16px Arial; fill:#334155; } .flow { stroke:#475569; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none; marker-end:url(#arrow-flow); } .audit { stroke:#94a3b8; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:8 7; fill:none; marker-end:url(#arrow-audit); } .box { stroke-width:2; rx:14; filter:url(#shadow); } .groupbox { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; stroke-dasharray:8 7; rx:18; }
    </style>

    <rect class="groupbox" x="25" y="35" width="1550" height="190"/>
    <text class="group" x="48" y="65">Main request flow</text>
    <rect class="box" x="55" y="100" width="145" height="72" fill="#dbeafe" stroke="#2563eb"/>
    <text class="label" x="127" y="132" text-anchor="middle">User</text><text class="small" x="127" y="154" text-anchor="middle">Question</text>
    <rect class="box" x="275" y="100" width="180" height="72" fill="#dbeafe" stroke="#2563eb"/>
    <text class="label" x="365" y="127" text-anchor="middle">Next.js Frontend</text><text class="small" x="365" y="151" text-anchor="middle">Vercel</text>
    <rect class="box" x="525" y="100" width="175" height="72" fill="#dbeafe" stroke="#2563eb"/>
    <text class="label" x="612" y="127" text-anchor="middle">FastAPI</text><text class="small" x="612" y="151" text-anchor="middle">API Gateway</text>
    <rect class="box" x="770" y="90" width="235" height="92" fill="#f3e8ff" stroke="#9333ea"/>
    <text class="label" x="887" y="119" text-anchor="middle">LangGraph Orchestrator</text><text class="small" x="887" y="143" text-anchor="middle">Domain routing</text><text class="small" x="887" y="163" text-anchor="middle">Clarification questions</text>
    <rect class="box" x="1075" y="90" width="230" height="92" fill="#f3e8ff" stroke="#9333ea"/>
    <text class="label" x="1190" y="119" text-anchor="middle">Specialist Agent</text><text class="small" x="1190" y="143" text-anchor="middle">Traffic · Accounting · Labor</text><text class="small" x="1190" y="163" text-anchor="middle">law domains</text>
    <rect class="box" x="1375" y="90" width="145" height="92" fill="#dcfce7" stroke="#059669"/>
    <text class="label" x="1447" y="119" text-anchor="middle">Hybrid RAG</text><text class="small" x="1447" y="143" text-anchor="middle">Retrieve + rank</text><text class="small" x="1447" y="163" text-anchor="middle">evidence</text>
    <path class="flow" d="M200 136 H275"/><path class="flow" d="M455 136 H525"/><path class="flow" d="M700 136 H770"/><path class="flow" d="M1005 136 H1075"/><path class="flow" d="M1305 136 H1375"/>

    <rect class="groupbox" x="45" y="270" width="650" height="250"/>
    <text class="group" x="70" y="300">Shared Hybrid RAG Engine</text>
    <rect class="box" x="75" y="335" width="165" height="65" fill="#ecfdf5" stroke="#059669"/><text class="label" x="157" y="363" text-anchor="middle">BM25</text><text class="small" x="157" y="384" text-anchor="middle">keyword search</text>
    <rect class="box" x="275" y="335" width="165" height="65" fill="#ecfdf5" stroke="#059669"/><text class="label" x="357" y="363" text-anchor="middle">ChromaDB</text><text class="small" x="357" y="384" text-anchor="middle">vector search</text>
    <rect class="box" x="475" y="335" width="165" height="65" fill="#ecfdf5" stroke="#059669"/><text class="label" x="557" y="363" text-anchor="middle">Metadata</text><text class="small" x="557" y="384" text-anchor="middle">filtering</text>
    <rect class="box" x="175" y="435" width="165" height="55" fill="#ecfdf5" stroke="#059669"/><text class="label" x="257" y="468" text-anchor="middle">RRF fusion</text>
    <rect class="box" x="375" y="435" width="165" height="55" fill="#ecfdf5" stroke="#059669"/><text class="label" x="457" y="468" text-anchor="middle">Reranking</text>
    <path class="flow" d="M157 400 V420 H257 V435"/><path class="flow" d="M357 400 V435"/><path class="flow" d="M557 400 V420 H257 V435"/><path class="flow" d="M340 462 H375"/>

    <rect class="groupbox" x="745" y="270" width="810" height="250"/>
    <text class="group" x="770" y="300">Legal Corpus — separated collections</text>
    <rect class="box" x="775" y="335" width="205" height="70" fill="#dcfce7" stroke="#059669"/><text class="label" x="877" y="365" text-anchor="middle">Traffic Law</text><text class="small" x="877" y="387" text-anchor="middle">collection</text>
    <rect class="box" x="1035" y="335" width="205" height="70" fill="#dcfce7" stroke="#059669"/><text class="label" x="1137" y="365" text-anchor="middle">Accounting Law</text><text class="small" x="1137" y="387" text-anchor="middle">collection</text>
    <rect class="box" x="1295" y="335" width="205" height="70" fill="#dcfce7" stroke="#059669"/><text class="label" x="1397" y="365" text-anchor="middle">Labor Law</text><text class="small" x="1397" y="387" text-anchor="middle">collection</text>
    <rect class="box" x="850" y="435" width="620" height="55" fill="#f0fdf4" stroke="#16a34a"/><text class="small" x="1160" y="458" text-anchor="middle">Each chunk: source URL · document no. · article · clause</text><text class="small" x="1160" y="477" text-anchor="middle">effective date · expiry date · status</text>
    <path class="flow" d="M877 405 V435 H850"/><path class="flow" d="M1137 405 V435"/><path class="flow" d="M1397 405 V435 H1470"/>

    <rect class="box" x="460" y="590" width="300" height="92" fill="#fff7ed" stroke="#ea580c"/><text class="label" x="610" y="620" text-anchor="middle">Citation &amp; Effective Date</text><text class="label" x="610" y="642" text-anchor="middle">Verifier</text><text class="small" x="610" y="663" text-anchor="middle">sufficient evidence · time applicability</text>
    <rect class="box" x="865" y="590" width="300" height="92" fill="#fff7ed" stroke="#ea580c"/><text class="label" x="1015" y="620" text-anchor="middle">OpenAI Answer</text><text class="small" x="1015" y="644" text-anchor="middle">grounded Vietnamese response</text><text class="small" x="1015" y="664" text-anchor="middle">citations + disclaimer</text>
    <path class="flow" d="M610 520 V590"/><path class="flow" d="M1160 490 V545 H610 V590"/><path class="flow" d="M760 636 H865"/><path class="flow" d="M1165 636 V735 H1545 V20 H20 V136 H55"/>
    <text class="small" x="1130" y="720">verified answer returns to user</text>

    <rect class="box" x="70" y="780" width="410" height="110" fill="#fef3c7" stroke="#d97706"/><text class="label" x="275" y="812" text-anchor="middle">SQLite / PostgreSQL</text><text class="small" x="275" y="837" text-anchor="middle">sessions · agent traces · retrieved evidence</text><text class="small" x="275" y="860" text-anchor="middle">citations · evaluation logs</text>
    <path class="audit" d="M612 172 V245 H720 V540 H430 V740 H275 V780"/><path class="audit" d="M887 182 V245 H720 V550 H410 V740 H275 V780"/><path class="audit" d="M610 682 V780"/>

    <rect class="groupbox" x="560" y="770" width="970" height="150"/>
    <text class="group" x="585" y="800">Admin Portal</text>
    <rect class="box" x="600" y="825" width="850" height="65" fill="#fef3c7" stroke="#d97706"/><text class="label" x="1025" y="853" text-anchor="middle">Update legal corpus · metadata · document versions · monitor traces</text><text class="small" x="1025" y="875" text-anchor="middle">Versioned, auditable writes to collections and operational database</text>
    <path class="audit" d="M1025 825 V735 H1520 V405"/><path class="audit" d="M1025 825 V735 H275 V780"/>
  </svg>
  <div class="legend"><span><i class="dot" style="background:#dbeafe"></i>Application layer</span><span><i class="dot" style="background:#f3e8ff"></i>Agent orchestration</span><span><i class="dot" style="background:#dcfce7"></i>RAG and corpus</span><span><i class="dot" style="background:#fff7ed"></i>Verification and answer</span><span><i class="dot" style="background:#fef3c7"></i>Persistence and administration</span></div>
</main>
</body>
</html>
