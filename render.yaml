services:
  - type: web
    name: trust-agent-api
    runtime: docker
    plan: free
    rootDir: crawl
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /domains/traffic/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: X402_ENABLED
        value: "true"
      - key: X402_PRICE_USD
        value: "0.01"
      - key: X402_NETWORK
        value: eip155:84532
      - key: X402_PAY_TO
        sync: false
      - key: X402_FACILITATOR_URL
        value: https://x402.org/facilitator
      - key: INDEX_VERSION
        value: traffic-v1
      - key: PROVENANCE_DB_PATH
        value: /tmp/provenance.sqlite3
      - key: REWARD_ADMIN_TOKEN
        generateValue: true
      - key: INGEST_ADMIN_TOKEN
        generateValue: true
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: REQUIRE_API_KEY
        value: "true"
